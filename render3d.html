<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MemProt2D — production 3D renderer (Phase 2)</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: sans-serif;
        background: #f8f9fa;
        color: #212529;
      }
      header {
        background: #1a1a2e;
        color: #fff;
        padding: 1rem 1.5rem;
      }
      header h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      header p {
        margin: 0.25rem 0 0;
        opacity: 0.75;
        font-size: 0.85rem;
      }
      .controls {
        display: flex;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
        padding: 0.75rem 1.5rem;
        background: #fff;
        border-bottom: 1px solid #dee2e6;
      }
      #morph {
        width: 280px;
        vertical-align: middle;
      }
      button,
      select {
        font: inherit;
        padding: 0.35rem 0.7rem;
        border: 1px solid #ced4da;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }
      #stage {
        width: 100%;
        height: 72vh;
      }
    </style>
    <script type="module" src="/src/render-3d/demo.ts"></script>
  </head>
  <body>
    <header>
      <h1>Production 3D renderer — Phase 2</h1>
      <p>Real proteins through buildScene() → TopologyView3D. Drag the slider to morph 2D ⇄ 3D.</p>
    </header>
    <div class="controls">
      <select id="picker" aria-label="Protein"></select>
      <button id="play">▶ Play</button>
      <label>2D <input id="morph" type="range" min="0" max="1" step="0.001" value="0" /> 3D</label>
      <span style="font-size: 0.8rem; color: #6c757d">drag to orbit · scroll to zoom</span>
    </div>
    <div id="stage"></div>
  </body>
</html>
