name: Gallery
on:
  push:
    branches: [main]
  pull_request:
# Two runs for the same branch would publish to the same folder: keep the newest.
concurrency:
  group: gallery-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  gallery:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install ffmpeg (transition animations)
        run: ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libwebp_anim || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - run: npm run build:demo
      - name: Fetch real PDB data for gallery
        run: npm run prebuild:gallery
        continue-on-error: true
      - name: Screenshot current branch
        run: node scripts/gallery-screenshot.mjs
      - name: Compute sanitized branch name
        id: branch
        run: |
          HEAD="${{ github.head_ref || github.ref_name }}"
          echo "sanitized=$(echo "$HEAD" | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Publish current screenshots to gallery-images branch
        # Retries a push rejected by another run publishing at the same time.
        run: scripts/gallery-publish.sh gallery-output/current "${{ steps.branch.outputs.sanitized }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
      - name: Download base branch gallery (PRs only)
        if: github.event_name == 'pull_request'
        run: node scripts/gallery-download-base.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
      - name: Generate comparison page
        run: node scripts/gallery-compare.mjs
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: gallery
          path: gallery-output/
          retention-days: 30
      - name: Generate sticky comment markdown
        if: github.event_name == 'pull_request'
        run: node scripts/gallery-comment.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
      - name: Post / update sticky PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: gallery
          path: gallery-comment.md
